services:
  redis:
    image: redis:latest
    ports:
      - 6379:6379
    env_file:
      - .env/redis.env
    volumes:
      - redis_data:/data
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 3000:3000
    depends_on:
      - redis
    env_file:
      - .env/redis.env
    volumes:
      - .:/app
      - /app/node_modules
volumes:
  redis_data: